<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery</title>
    <link rel="stylesheet" href="../../styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>

<body class="body-gallery">
    <header class="gallery-header">
        <div class="logo">
            <a href="">
                <img src="/assets/logo.svg" alt="">
            </a>
        </div>
        <nav class="nav-links">
            <a href="/pages/about/about.html"x>About</a>
            <a href="/pages/gallery/gallery.html">Gallery</a>
            <a href="/pages/guides/guides.html">Guides</a>
            <a href="/pages/events/events.html">Events</a>
        </nav>
        <h1>Gallery</h1>
        <p>Projects and creations made by club members</p>
    </header>

    <div id="gallery-container"></div>

    <script>
        async function loadGallery() {
            try {
                const response = await fetch('/assets/JSON/gallery.json');
                const gallery = await response.json();
                const container = document.getElementById('gallery-container');

                container.innerHTML = gallery.map(m => `
                    <div class="gallery-card">
                        <a href="${m.link}" target="_blank" rel="noopener noreferrer">
                            <div class="gallery-img">
                                <img src="${m.image}" alt="${m.name}">
                            </div>
                            <figcaption>
                                <h3>${m.name}</h3>
                            </figcaption>
                        </a> 
                    </div>
                `).join('');
            } catch (err) {
                console.error('Failed to load gallery:', err);
            }
        }
        loadGallery();
    </script>
</body>
</html>
